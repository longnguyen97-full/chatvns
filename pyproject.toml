[project]
name = "chatvns"
version = "0.1.0"
description = "A chatbot for analyzing VN stock market"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "deepeval>=3.0.0",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.34.0",
    "pandas>=2.2.0",
    "playwright>=1.44.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.12.0,<1.14.0",
    "rank-bm25>=0.2.2",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "streamlit>=1.38.0",
    "streamlit-extras>=0.7.0",
]

[project.scripts]
pipeline = "main:run_pipeline"
